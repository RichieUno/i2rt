  # The 7-DOF arm's two sides are separate families, so each carries its own block. joint7 is a
  # wrist pitch rather than the tool roll, so the gripper bolts off that axis --
  # gripper_pos/gripper_quat carry that offset, which the mount pose cannot (moving it would
  # move joint7's axis line).
  yam_7dof_left:
    v1:
      pos: "4.47332e-06 -0.02565 -0.0380064"
      quat: "-7.3122876473820652e-14 -7.3123145069636984e-14 0.70710807985947355 0.70710548251123628"
      axis: "0 0 -1"
      gripper_pos: "-0.068901 -0.000294 0.025637"
      gripper_quat: "-0.70711 0 0.70711 0"
  yam_7dof_right:
    v1:
      pos: "4.47332e-06 0.02565 -0.0380064"
      quat: "-7.3122876473820652e-14 7.3123145069636984e-14 0.70710807985947355 -0.70710548251123628"
      axis: "0 0 1"
      gripper_pos: "-0.068901 0.000294 0.025637"
      gripper_quat: "0 0.70711 0 -0.70711"

# Gripper motor config
motor_type: "DM4310"
motor_kp: 20.0
motor_kd: 0.5

# Gripper limits (null = needs calibration)
gripper_limits: null
needs_calibration: true

# Force limiter config
limiter:
  clog_force_threshold: 0.5
  clog_speed_threshold: 0.3
  sign: 1.0
  force_torque_map: "linear"
  motor_stroke: 6.57
  gripper_stroke: 0.096

# Torque/force control envelope (MotorChainRobot.command_joint_state with "gripper_force").
# Force is mapped to motor torque through the limiter's force_torque_map above.
force_control:
  max_force: 50.0      # N, commands are clamped to +-this
  max_torque: 1.5      # Nm at the motor, clamp after the force map
  wall_margin: 0.05    # normalized stroke: torque toward a stop tapers to zero over this band
  max_speed: 2.0       # normalized stroke / s: torque along the motion is zero at twice this
  kd: 0.05             # Nm s/rad. Pure damping at kp = 0: the position-mode kd (0.5) eats most of the
                       # torque once the jaws move. The speed limit, not kd, guards against overspeed.
  gripper_stroke: 0.092  # m of jaw travel between the calibrated stops, for force control only (the
                         # limiter block's 0.096 is the nominal opening). Measured on one linear_4310 by
                         # calipers: 18.03 mm per motor rad over a settled calibrated stroke of ~5.10 rad.
